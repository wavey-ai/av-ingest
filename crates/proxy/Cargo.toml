[package]
name = "av-ingest-proxy"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
dotenvy = "0.15"
futures-util = "0.3"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
web-service = { git = "https://github.com/wavey-ai/web-services.git", package = "web-service", rev = "065ccab2d5f4a61ccc0bf7b3e3d32da2759828f4" }
